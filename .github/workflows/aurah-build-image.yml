name: Aurah Postiz image

on:
  push:
    branches: [codex/host-only-cookies]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurah-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ricdomingues/postiz-app' && github.ref == 'refs/heads/codex/host-only-cookies'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify host-only cookie helper
        run: node --test libraries/helpers/src/subdomain/subdomain.management.test.mjs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish staging image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ricdomingues/postiz-app:sha-${{ github.sha }}
          build-args: NEXT_PUBLIC_VERSION=v2.25.3-aurah-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ricdomingues/postiz-app
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=aurah-postiz-amd64
          cache-to: type=gha,mode=max,scope=aurah-postiz-amd64
      - name: Record immutable deployment reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Staging image: `ghcr.io/ricdomingues/postiz-app@%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
